<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Iniciar Sesión · Accesorios Restre</title>
<meta name="robots" content="noindex,nofollow" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0A0A0A; --ink-2:#141414; --ink-3:#1C1C1C; --ink-4:#262626;
  --line:rgba(255,255,255,.08); --line-strong:rgba(255,255,255,.18);
  --text:#FFFFFF; --text-soft:#E5E5E5;
  --muted:#A3A3A3; --muted-2:#6B6B6B; --muted-3:#404040;
  --white:#FFFFFF; --gray-1:#F5F5F5;
  --danger:#F87171; --warn:#FBBF24; --success:#4ADE80;
  --shadow:0 30px 70px -24px rgba(0,0,0,.95);
}
*,*::before,*::after{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; background:var(--ink); color:var(--text);
  font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  font-size:16px; line-height:1.6; -webkit-font-smoothing:antialiased;
  overflow-x:hidden; min-height:100vh;
  display:grid; place-items:center; padding:24px;
}
body::before{
  content:""; position:fixed; inset:0; z-index:-2;
  background:
    radial-gradient(720px 520px at 20% 10%, rgba(255,255,255,.05), transparent 60%),
    radial-gradient(600px 500px at 85% 90%, rgba(255,255,255,.03), transparent 65%);
  pointer-events:none;
}
body::after{
  content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
  background-image:
    linear-gradient(rgba(255,255,255,.02) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.02) 1px, transparent 1px);
  background-size:70px 70px;
  mask-image:radial-gradient(circle at 50% 50%, #000 0%, transparent 72%);
  -webkit-mask-image:radial-gradient(circle at 50% 50%, #000 0%, transparent 72%);
}
::selection{background:rgba(255,255,255,.25);color:#000;}

.login-wrap{width:100%;max-width:440px;animation:cardIn .7s cubic-bezier(.2,.8,.3,1);}
@keyframes cardIn{from{opacity:0;transform:translateY(26px) scale(.97);}to{opacity:1;transform:none;}}

.login-card{
  position:relative; padding:42px 36px 36px;
  border-radius:24px; border:1px solid var(--line);
  background:linear-gradient(180deg, rgba(28,28,28,.85), rgba(20,20,20,.92));
  backdrop-filter:blur(24px) saturate(140%);
  -webkit-backdrop-filter:blur(24px) saturate(140%);
  box-shadow:var(--shadow); overflow:hidden;
}
@media(max-width:480px){.login-card{padding:32px 22px 26px;border-radius:20px;}}
.login-card::before{
  content:""; position:absolute; top:0; left:50%; transform:translateX(-50%);
  width:70%; height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);
}
.login-card::after{
  content:""; position:absolute; top:-60px; left:50%; transform:translateX(-50%);
  width:260px; height:140px;
  background:radial-gradient(ellipse at center, rgba(255,255,255,.08), transparent 70%);
  pointer-events:none;
}

.back-to-store{
  display:inline-flex; align-items:center; gap:7px;
  position:absolute; top:16px; left:16px;
  padding:7px 12px; border-radius:9px;
  font-size:.72rem; font-weight:600;
  letter-spacing:.04em; color:var(--muted);
  border:1px solid var(--line); background:rgba(255,255,255,.02);
  transition:color .2s,border-color .2s,background .2s,transform .2s;
  z-index:2;
}
.back-to-store:hover{color:var(--text);border-color:var(--line-strong);background:rgba(255,255,255,.06);transform:translateX(-2px);}
.back-to-store svg{width:13px;height:13px;flex-shrink:0;}

.login-header{text-align:center; margin-bottom:32px; position:relative; z-index:1;}
.logo-circle{
  width:88px; height:88px; border-radius:50%; background:var(--white);
  display:grid; place-items:center; margin:0 auto 20px;
  box-shadow:0 20px 44px -14px rgba(255,255,255,.28), 0 0 0 1px rgba(255,255,255,.1);
  transition:transform .5s cubic-bezier(.2,.8,.3,1);
}
.logo-circle:hover{transform:scale(1.04);}
.logo-circle svg{width:58px;height:58px;}
.logo-circle svg path,.logo-circle svg rect,.logo-circle svg circle{
  stroke:#0A0A0A; fill:none; stroke-width:1.4;
  stroke-linecap:round; stroke-linejoin:round;
}
.logo-circle svg .fill-black{fill:#0A0A0A;stroke:none;}

.login-brand-small{
  font-size:.68rem; font-weight:400;
  letter-spacing:.34em; color:var(--muted); text-transform:uppercase; margin-bottom:6px;
}
.login-brand-title{
  font-family:'Space Grotesk',sans-serif;
  font-size:1.18rem; font-weight:700;
  letter-spacing:.2em; color:var(--white); margin-bottom:4px;
}
.login-title{
  font-family:'Space Grotesk',sans-serif;
  font-size:.92rem; font-weight:500;
  letter-spacing:.06em; color:var(--text-soft); margin-top:16px;
}
.login-subtitle{font-size:.78rem; color:var(--muted-2); margin-top:6px;}

.form-group{margin-bottom:16px; position:relative; z-index:1;}
.form-group label{
  display:block; font-size:.68rem; font-weight:600; color:var(--muted);
  margin-bottom:8px; letter-spacing:.14em; text-transform:uppercase;
}
.input-wrap{position:relative;}
.input-wrap input{
  width:100%; padding:14px 46px 14px 44px;
  border-radius:12px; background:rgba(255,255,255,.04);
  border:1px solid var(--line); outline:none;
  font-size:.92rem; font-family:'Inter',sans-serif; color:var(--text);
  transition:border-color .25s,background .25s,box-shadow .25s;
}
.input-wrap input::placeholder{color:var(--muted-3);font-size:.88rem;}
.input-wrap input:focus{
  border-color:rgba(255,255,255,.45);
  background:rgba(255,255,255,.07);
  box-shadow:0 0 0 4px rgba(255,255,255,.04);
}
.input-wrap input:disabled{opacity:.55;cursor:not-allowed;}
.input-icon{
  position:absolute; left:14px; top:50%; transform:translateY(-50%);
  width:18px; height:18px; color:var(--muted);
  pointer-events:none; transition:color .25s;
}
.toggle-pwd{
  position:absolute; right:10px; top:50%; transform:translateY(-50%);
  width:34px; height:34px; border-radius:9px;
  display:grid; place-items:center; color:var(--muted);
  background:transparent; border:none; cursor:pointer; padding:0;
  transition:background .2s,color .2s;
}
.toggle-pwd:hover{background:rgba(255,255,255,.08);color:var(--text);}
.toggle-pwd svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}

.form-row-between{
  display:flex; align-items:center; justify-content:space-between;
  margin-bottom:22px; flex-wrap:wrap; gap:10px;
}
.checkbox-wrap{
  display:inline-flex; align-items:center; gap:10px;
  cursor:pointer; user-select:none; font-size:.8rem; color:var(--text-soft);
  transition:color .2s;
}
.checkbox-wrap:hover{color:var(--white);}
.checkbox-wrap input{position:absolute;opacity:0;pointer-events:none;}
.checkbox-box{
  width:18px; height:18px; border-radius:5px;
  border:1.5px solid var(--muted-3); background:rgba(255,255,255,.03);
  display:grid; place-items:center;
  transition:border-color .2s,background .2s; flex-shrink:0;
}
.checkbox-box::after{
  content:""; width:10px; height:5px;
  border-left:2px solid var(--ink); border-bottom:2px solid var(--ink);
  transform:rotate(-45deg) scale(0); transform-origin:center;
  transition:transform .2s cubic-bezier(.3,1.5,.5,1);
  margin-top:-2px;
}
.checkbox-wrap input:checked + .checkbox-box{background:var(--white);border-color:var(--white);}
.checkbox-wrap input:checked + .checkbox-box::after{transform:rotate(-45deg) scale(1);}
.forgot-link{font-size:.78rem;color:var(--muted);transition:color .2s;}
.forgot-link:hover{color:var(--white);}

.btn-login{
  width:100%; padding:15px 20px; border-radius:12px;
  background:var(--white); color:var(--ink);
  font-family:'Inter',sans-serif; font-size:.88rem;
  font-weight:600; letter-spacing:.06em; text-transform:uppercase;
  cursor:pointer; border:none;
  transition:transform .2s,box-shadow .25s,background .2s,opacity .2s;
  display:flex; align-items:center; justify-content:center; gap:10px;
  position:relative; overflow:hidden;
}
.btn-login:hover:not(:disabled){
  transform:translateY(-2px); background:var(--gray-1);
  box-shadow:0 20px 40px -16px rgba(255,255,255,.45), 0 0 0 1px rgba(255,255,255,.2);
}
.btn-login:active:not(:disabled){transform:translateY(0);}
.btn-login:disabled{cursor:not-allowed;opacity:.75;}
.btn-login .spinner{
  width:16px; height:16px;
  border:2px solid rgba(10,10,10,.25);
  border-top-color:var(--ink);
  border-radius:50%; animation:spin .7s linear infinite; display:none;
}
.btn-login.loading .spinner{display:block;}
@keyframes spin{to{transform:rotate(360deg);}}

.alert{
  display:flex; gap:12px; align-items:flex-start;
  padding:13px 16px; border-radius:11px;
  font-size:.82rem; line-height:1.45;
  margin-bottom:16px; border:1px solid;
  position:relative; z-index:1;
  animation:alertIn .35s cubic-bezier(.2,.8,.3,1);
}
@keyframes alertIn{from{opacity:0;transform:translateY(-6px);}to{opacity:1;transform:none;}}
.alert.danger{background:rgba(248,113,113,.08);border-color:rgba(248,113,113,.35);color:#FCA5A5;}
.alert.warn{background:rgba(251,191,36,.08);border-color:rgba(251,191,36,.35);color:#FCD34D;}
.alert.success{background:rgba(74,222,128,.08);border-color:rgba(74,222,128,.35);color:#86EFAC;}
.alert .ic{font-size:1rem;flex-shrink:0;line-height:1.4;}
.lockout-count{
  font-family:'Space Grotesk',sans-serif; font-weight:700; color:#fff;
  margin-left:4px; min-width:26px; display:inline-block;
  text-align:center; font-variant-numeric:tabular-nums;
}
.attempts-bar{display:flex;gap:5px;margin-bottom:18px;position:relative;z-index:1;}
.attempt-dot{
  flex:1; height:3px; border-radius:99px;
  background:rgba(255,255,255,.08); transition:background .3s;
}
.attempt-dot.used{background:var(--danger);}

.dev-note{
  margin-top:22px; padding:12px 14px; border-radius:10px;
  background:rgba(255,255,255,.025); border:1px dashed rgba(255,255,255,.12);
  font-size:.7rem; color:var(--muted-2); line-height:1.55;
  position:relative; z-index:1;
}
.dev-note strong{color:var(--muted);font-weight:600;}
.dev-note code{
  font-family:'Space Grotesk',monospace;
  background:rgba(255,255,255,.06); padding:1px 6px; border-radius:4px;
  color:var(--text-soft); font-size:.68rem;
}

.login-footer{
  text-align:center; margin-top:22px;
  font-size:.7rem; color:var(--muted-3); letter-spacing:.04em;
}
.login-footer a{color:var(--muted);transition:color .2s;}
.login-footer a:hover{color:var(--white);}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important;}
}
</style>
</head>
<body>

<main class="login-wrap">
  <div class="login-card">

    <a href="index.html" class="back-to-store" aria-label="Volver a la tienda">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <line x1="19" y1="12" x2="5" y2="12"/>
        <polyline points="12 19 5 12 12 5"/>
      </svg>
      Volver a la Tienda
    </a>

    <div class="login-header">
      <div class="logo-circle" aria-hidden="true">
        <svg viewBox="0 0 40 40">
          <path d="M8 22 V18 C8 11 13 6 20 6 C27 6 32 11 32 18 V22"/>
          <rect x="5" y="20" width="5" height="9" rx="2"/>
          <rect x="30" y="20" width="5" height="9" rx="2"/>
          <rect x="12" y="14" width="16" height="22" rx="3.5"/>
          <rect x="17" y="21" width="6" height="7" rx="1.4" class="fill-black"/>
          <path d="M19 21 V19.5 H21 V21" class="fill-black" stroke="none"/>
          <path d="M19 28 V29.5 H21 V28" class="fill-black" stroke="none"/>
        </svg>
      </div>
      <div class="login-brand-small">Accesorios</div>
      <div class="login-brand-title">RESTRE</div>
      <div class="login-title">Acceso al Panel Administrativo</div>
      <div class="login-subtitle">Ingresa tus credenciales para continuar</div>
    </div>

    <div id="alertZone" role="alert" aria-live="polite"></div>

    <div class="attempts-bar" id="attemptsBar" aria-hidden="true">
      <div class="attempt-dot"></div>
      <div class="attempt-dot"></div>
      <div class="attempt-dot"></div>
      <div class="attempt-dot"></div>
      <div class="attempt-dot"></div>
    </div>

    <form id="loginForm" autocomplete="on" novalidate>
      <div class="form-group">
        <label for="username">Usuario o correo</label>
        <div class="input-wrap">
          <input type="text" id="username" name="username" placeholder="admin"
                 autocomplete="username" spellcheck="false" autocapitalize="off"
                 required maxlength="64" />
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
        </div>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <div class="input-wrap">
          <input type="password" id="password" name="password" placeholder="••••••••••"
                 autocomplete="current-password" required maxlength="128" />
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="11" width="18" height="11" rx="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <button type="button" class="toggle-pwd" id="togglePwd" aria-label="Mostrar contraseña" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="form-row-between">
        <label class="checkbox-wrap">
          <input type="checkbox" id="rememberMe" />
          <span class="checkbox-box" aria-hidden="true"></span>
          <span>Recordar sesión</span>
        </label>
        <a href="#" class="forgot-link" onclick="event.preventDefault();">¿Olvidaste tu contraseña?</a>
      </div>

      <button type="submit" class="btn-login" id="loginBtn">
        <span class="spinner" aria-hidden="true"></span>
        <span id="btnText">Iniciar sesión</span>
      </button>
    </form>

    <div class="dev-note">
      <strong>Entorno de prueba:</strong> usuario <code>admin</code> · clave <code>Restre2025*</code>.
      Modifica <code>VALID_USERS</code> en el script para producción.
    </div>

    <div class="login-footer">
      © 2025 Accesorios Restre · <a href="index.html">Volver a la tienda</a>
    </div>
  </div>
</main>

<script>
(function(){
  'use strict';

  const CONFIG = {
    REMEMBER_MS: 7 * 24 * 60 * 60 * 1000,
    SESSION_MS:  30 * 60 * 1000,
    MAX_ATTEMPTS: 5,
    LOCKOUT_MS: 60 * 1000,
    NETWORK_DELAY_MS: 800,
    STORAGE_KEY: 'restre_session',
    ATTEMPTS_KEY: 'restre_attempts',
    LOCKOUT_KEY: 'restre_lockout',
    SALT: 'Restre::2025::Accesorios'
  };

  const VALID_USERS = {
    'admin':           hashPassword('Restre2025*'),
    'admin@restre.co': hashPassword('Restre2025*'),
    'vendedor':        hashPassword('Restre2025*')
  };

  const USER_DISPLAY = {
    'admin':           'Administrador',
    'admin@restre.co': 'Administrador',
    'vendedor':        'Vendedor'
  };

  function hashPassword(str){
    const input = String(str) + CONFIG.SALT;
    let h = 0x811c9dc5;
    for (let i = 0; i < input.length; i++){
      h ^= input.charCodeAt(i);
      h = (h * 0x01000193) >>> 0;
    }
    return h.toString(16).padStart(8, '0');
  }

  function sanitize(input){
    return String(input ?? '').trim().replace(/[<>"'`\\]/g, '').slice(0, 128);
  }

  function generateToken(){
    if (window.crypto && window.crypto.getRandomValues){
      const arr = new Uint8Array(32);
      window.crypto.getRandomValues(arr);
      return Array.from(arr, b => b.toString(16).padStart(2, '0')).join('');
    }
    return Math.random().toString(36).slice(2) + Date.now().toString(36);
  }

  const getAttempts    = () => parseInt(localStorage.getItem(CONFIG.ATTEMPTS_KEY) || '0', 10);
  const setAttempts    = (n) => localStorage.setItem(CONFIG.ATTEMPTS_KEY, String(n));
  const resetAttempts  = () => localStorage.removeItem(CONFIG.ATTEMPTS_KEY);
  const getLockoutUntil= () => parseInt(localStorage.getItem(CONFIG.LOCKOUT_KEY) || '0', 10);
  const setLockoutUntil= (ts) => localStorage.setItem(CONFIG.LOCKOUT_KEY, String(ts));
  const clearLockout   = () => localStorage.removeItem(CONFIG.LOCKOUT_KEY);

  const alertZone  = document.getElementById('alertZone');
  const attemptsBar= document.getElementById('attemptsBar');
  const dots       = attemptsBar ? [...attemptsBar.querySelectorAll('.attempt-dot')] : [];

  function clearAlert(){ alertZone.innerHTML = ''; }
  function showAlert(message, type = 'danger', icon = '⚠️'){
    clearAlert();
    const el = document.createElement('div');
    el.className = 'alert ' + type;
    el.innerHTML = `<span class="ic">${icon}</span><span>${message}</span>`;
    alertZone.appendChild(el);
  }
  function updateAttemptsBar(){
    const n = getAttempts();
    dots.forEach((d, i) => d.classList.toggle('used', i < n));
  }

  let countdownTimer = null;
  function startLockoutCountdown(){
    const btn      = document.getElementById('loginBtn');
    const btnText  = document.getElementById('btnText');
    const userInp  = document.getElementById('username');
    const passInp  = document.getElementById('password');

    btn.disabled = true;
    userInp.disabled = true;
    passInp.disabled = true;

    if (countdownTimer) clearInterval(countdownTimer);

    countdownTimer = setInterval(() => {
      const remaining = Math.ceil((getLockoutUntil() - Date.now()) / 1000);

      if (remaining <= 0){
        clearInterval(countdownTimer);
        countdownTimer = null;
        clearLockout();
        resetAttempts();
        updateAttemptsBar();

        btn.disabled = false;
        userInp.disabled = false;
        passInp.disabled = false;
        btnText.textContent = 'Iniciar sesión';
        clearAlert();
        showAlert('Ya puedes intentar de nuevo.', 'success', '✓');
        return;
      }

      showAlert(
        `Demasiados intentos fallidos. Reintenta en <span class="lockout-count">${remaining}</span>s.`,
        'warn', '🔒'
      );
      btnText.textContent = `Bloqueado ${remaining}s`;
    }, 250);
  }

  function checkLockoutOnLoad(){
    const until = getLockoutUntil();
    if (until && until > Date.now()) startLockoutCountdown();
    else if (until){ clearLockout(); resetAttempts(); }
  }

  const togglePwd = document.getElementById('togglePwd');
  const pwdInput  = document.getElementById('password');

  togglePwd.addEventListener('click', () => {
    const isPwd = pwdInput.type === 'password';
    pwdInput.type = isPwd ? 'text' : 'password';
    togglePwd.setAttribute('aria-pressed', String(isPwd));
    togglePwd.setAttribute('aria-label', isPwd ? 'Ocultar contraseña' : 'Mostrar contraseña');
    togglePwd.innerHTML = isPwd
      ? `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`
      : `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`;
    pwdInput.focus();
  });

  function saveSession(user, remember){
    const now = Date.now();
    const ttl = remember ? CONFIG.REMEMBER_MS : CONFIG.SESSION_MS;
    const session = {
      user: user,
      display: USER_DISPLAY[user] || user,
      token: generateToken(),
      issuedAt: now,
      expiresAt: now + ttl
    };
    const storage = remember ? localStorage : sessionStorage;
    if (remember) sessionStorage.removeItem(CONFIG.STORAGE_KEY);
    else          localStorage.removeItem(CONFIG.STORAGE_KEY);
    storage.setItem(CONFIG.STORAGE_KEY, JSON.stringify(session));
  }

  const form      = document.getElementById('loginForm');
  const userInput = document.getElementById('username');
  const rememberCb= document.getElementById('rememberMe');
  const loginBtn  = document.getElementById('loginBtn');
  const btnText   = document.getElementById('btnText');

  const fakeNetworkDelay = (ms) => new Promise(res => setTimeout(res, ms));

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    if (getLockoutUntil() > Date.now()) return;
    clearAlert();

    const user = sanitize(userInput.value).toLowerCase();
    const pass = String(pwdInput.value).slice(0, 128);

    if (!user){ showAlert('Ingresa tu usuario o correo.', 'danger', '⚠️'); userInput.focus(); return; }
    if (!pass){ showAlert('Ingresa tu contraseña.', 'danger', '⚠️'); pwdInput.focus(); return; }

    loginBtn.classList.add('loading');
    loginBtn.disabled = true;
    userInput.disabled = true;
    pwdInput.disabled = true;
    btnText.textContent = 'Verificando credenciales…';

    await fakeNetworkDelay(CONFIG.NETWORK_DELAY_MS);

    const passHash = hashPassword(pass);
    const userValid = Object.prototype.hasOwnProperty.call(VALID_USERS, user);
    const passValid = userValid && VALID_USERS[user] === passHash;

    if (userValid && passValid){
      resetAttempts();
      clearLockout();
      updateAttemptsBar();
      saveSession(user, rememberCb.checked);

      btnText.textContent = 'Acceso concedido ✓';
      showAlert('Verificación correcta. Redirigiendo…', 'success', '✓');

      setTimeout(() => { window.location.href = 'admin.html'; }, 550);
      return;
    }

    const attempts = getAttempts() + 1;
    setAttempts(attempts);
    updateAttemptsBar();

    loginBtn.classList.remove('loading');
    loginBtn.disabled = false;
    userInput.disabled = false;
    pwdInput.disabled = false;
    btnText.textContent = 'Iniciar sesión';

    if (attempts >= CONFIG.MAX_ATTEMPTS){
      setLockoutUntil(Date.now() + CONFIG.LOCKOUT_MS);
      startLockoutCountdown();
      pwdInput.value = '';
      return;
    }

    const remaining = CONFIG.MAX_ATTEMPTS - attempts;
    showAlert(
      `Credenciales incorrectas. Te quedan <strong>${remaining}</strong> intento${remaining !== 1 ? 's' : ''}.`,
      'danger', '⚠️'
    );
    pwdInput.value = '';
    pwdInput.focus();
  });

  function checkExistingSession(){
    for (const s of [localStorage, sessionStorage]){
      const raw = s.getItem(CONFIG.STORAGE_KEY);
      if (!raw) continue;
      try {
        const session = JSON.parse(raw);
        if (session.expiresAt && session.expiresAt > Date.now()){
          window.location.href = 'admin.html';
          return;
        }
        s.removeItem(CONFIG.STORAGE_KEY);
      } catch(_){ s.removeItem(CONFIG.STORAGE_KEY); }
    }
  }

  function init(){
    updateAttemptsBar();
    checkLockoutOnLoad();
    checkExistingSession();
    if (!getLockoutUntil() || getLockoutUntil() < Date.now()){
      setTimeout(() => userInput.focus(), 400);
    }
    pwdInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !loginBtn.disabled){
        form.requestSubmit ? form.requestSubmit() : form.submit();
      }
    });
  }

  init();

})();
</script>
</body>
